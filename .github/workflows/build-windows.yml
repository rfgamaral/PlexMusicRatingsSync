name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - '**'
    tags:
      - '*'

jobs:
  build-windows:
    name: 🚀 Create GitHub release
    runs-on: windows-latest
    steps:
      - name: 🧾 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: 🏗 Build executable
        run: pyinstaller --clean PlexMusicRatingsSync.exe.spec

      - name: 💯 Test executable
        shell: pwsh
        working-directory: dist
        run: |
          .\PlexMusicRatingsSync.exe --version
          .\PlexMusicRatingsSync.exe
          .\PlexMusicRatingsSync.exe --help
          .\PlexMusicRatingsSync.exe sync --help
          .\PlexMusicRatingsSync.exe info

      - name: ✂️ Get short SHA
        id: short_sha
        shell: pwsh
        run: |
          $short_sha = git rev-parse --short HEAD
          echo "result=$short_sha" >> $env:GITHUB_OUTPUT
          Write-Host "short_sha=$short_sha"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.short_sha.outputs.result }}
          name: "Windows Executable (${{ steps.short_sha.outputs.result }})"
          body: "Automated build of Windows executable from commit ${{ steps.short_sha.outputs.result }}"
          files: dist/PlexMusicRatingsSync.exe
          make_latest: ${{ (github.ref == 'refs/heads/main') && startsWith(github.ref, 'refs/tags/v') }}
          draft:     ${{ !((github.ref == 'refs/heads/main') && startsWith(github.ref, 'refs/tags/v')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
